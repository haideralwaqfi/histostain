; HistoStains — PHP-FPM pool
; Copy to: /etc/php/8.3/fpm/pool.d/histostains.conf
; Then:    rm /etc/php/8.3/fpm/pool.d/www.conf   (disable default pool)
;          systemctl restart php8.3-fpm
;
; Tune pm.max_children to (available_RAM_MB - 256) / 30
;   1 GB droplet  → ~24 max  (set to 15 to leave headroom)
;   2 GB droplet  → ~57 max  (set to 20)
;   4 GB droplet  → ~124 max (set to 40)

[histostains]
user  = www-data
group = www-data

; Dedicated socket — matches nginx fastcgi_pass
listen       = /run/php/php8.3-fpm-histostains.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Dynamic process management
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500   ; recycle workers to prevent slow memory leaks

; Timeouts
request_terminate_timeout = 120
request_slowlog_timeout   = 10
slowlog = /var/www/histostains/storage/logs/php-fpm-slow.log

; PHP overrides for this pool
php_admin_value[error_log]          = /var/www/histostains/storage/logs/php-fpm-error.log
php_admin_flag[log_errors]          = on
php_admin_value[memory_limit]       = 256M
php_admin_value[upload_max_filesize]= 20M
php_admin_value[post_max_size]      = 25M
php_admin_value[max_execution_time] = 60

; OPcache — critical for production performance
php_admin_flag[opcache.enable]                 = on
php_admin_value[opcache.memory_consumption]    = 128
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_flag[opcache.validate_timestamps]    = off   ; set on during deploys if needed
php_admin_value[opcache.revalidate_freq]       = 0

; Environment — passes the app .env path so Laravel can find it
env[APP_ENV] = production
