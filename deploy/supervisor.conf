; HistoStains — Supervisor queue worker config
; Copy to: /etc/supervisor/conf.d/histostains.conf
; Then:    supervisorctl reread && supervisorctl update
;
; Workers process queued jobs: notifications, email, push delivery.
; numprocs=3 is right for a 2 GB droplet.  Scale up if jobs queue up.

[program:histostains-worker]
process_name = %(program_name)s_%(process_num)02d
command      = php /var/www/histostains/artisan queue:work database \
                   --sleep=3 \
                   --tries=3 \
                   --max-time=3600 \
                   --memory=128 \
                   --queue=default
directory    = /var/www/histostains
user         = www-data
numprocs     = 3
autostart    = true
autorestart  = true
startsecs    = 1

; Keep workers alive until any in-flight job finishes (up to 1 h)
stopwaitsecs    = 3600
stopasgroup     = true
killasgroup     = true

redirect_stderr = true
stdout_logfile  = /var/www/histostains/storage/logs/worker.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3

; Raise open-file limit to handle many simultaneous DB connections
minfds = 1024
