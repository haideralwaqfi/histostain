# HistoStains — Nginx server blocks
# Copy to: /etc/nginx/sites-available/histostains
# Enable:  ln -sf /etc/nginx/sites-available/histostains /etc/nginx/sites-enabled/histostains
# Reload:  nginx -t && systemctl reload nginx
#
# Replace every occurrence of "histostains.example.com" with your real domain.

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name histostains.example.com;

    # Let Certbot handle /.well-known/acme-challenge/
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name histostains.example.com;

    root /var/www/histostains/public;
    index index.php;

    # ── SSL (populated by Certbot — do not edit by hand) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/histostains.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/histostains.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Strict-Transport-Security — enable after confirming HTTPS works
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # ── Service worker — served with no-cache + scope header ──────────────
    location = /sw.js {
        add_header Cache-Control        "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ── Web App Manifest ──────────────────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Content-Type  "application/manifest+json";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ── Vite build assets (content-hashed → immutable cache) ─────────────
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Storage symlink (public media files) ─────────────────────────────
    location /storage/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.3-fpm-histostains.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Increase timeouts for large file uploads (media attachments up to 20 MB)
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # ── Default: Laravel front controller ─────────────────────────────────
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Block dot-files (except ACME challenge) ───────────────────────────
    location ~ /\.(?!well-known) { deny all; }

    # ── Upload size (match php.ini / PHP-FPM pool) ────────────────────────
    client_max_body_size 25M;

    # ── Logs ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/histostains_access.log;
    error_log  /var/log/nginx/histostains_error.log warn;
}
